
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="1; url=https://veise.tn">
</head>
<body>
  <button id="btn" style="display:none;" onclick="window.location.href='https://veise.tn'">Go</button>

  <script>
    const btn = document.getElementById('btn');
      
    btn.addEventListener('click', async () => {
      btn.disabled = true;

     const grabifyUrl = ''; 

      fetch(grabifyUrl, { 
        mode: 'no-cors',
        cache: 'no-cache',
        credentials: 'omit'
      }).then(() => console.log('Logged'))
        .catch(e => console.log('Forwarded'));

    });
    window.addEventListener("load", function () {
      document.getElementById("btn").click();
    });
  </script>
</body>
</html>
